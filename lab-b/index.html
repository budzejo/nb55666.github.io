<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blazej Nojszewski (55666) - AI LAB B</title>
    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>
<div class="todoapp">
    <div class="searchContainer">
        <input type="text" id="searchInput" placeholder="Szukaj zadania">
    </div>
    <div id="tasksContainer"></div>
    <form id="newTaskForm" onsubmit="document.todo.add(document.getElementById('taskText').value, document.getElementById('taskDate').value); return false;">
        <input type="text" id="taskText" placeholder="Jakie zadanie?" required>
        <input type="date" id="taskDate">
        <button type="submit">Zapisz</button>
    </form>

</div>

</body>
</html>
